[package]
name = "gha-see"
version = "0.1.0"
edition = "2021"
description = "Offline-first GitHub Actions visualizer. Never runs a workflow."
license = "MIT"
publish = true
repository = "https://github.com/train-dev-bot/gha-see"
homepage = "https://github.com/train-dev-bot/gha-see"
readme = "README.md"
exclude = ["docs/superpowers/", "docs/gifs/", "dev-env.kdl"]

[dependencies]
axum = "0.8"
dirs = "6.0.0"
flate2 = "1.1.9"
glob = "0.3"
open = "5"
petgraph = "0.6"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4.46"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json"] }
axum = "0.8"
